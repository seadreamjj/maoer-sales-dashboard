
name: 更新猫耳网页

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'build_site.py'
      - 'sales_calculator.py'
      - 'requirements.txt'
      - '.github/workflows/build-site.yml'

  workflow_run:
    workflows:
      - 抓取猫耳数据
    types:
      - completed

concurrency:
  group: maoer-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1：构建网页并上传 Artifact
  # ============================================================
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Dashboard
        run: python build_site.py

      - name: 检查网页构建结果
        shell: bash
        run: |
          if [ ! -s "site/index.html" ]; then
            echo "::error::site/index.html 不存在或为空"
            exit 1
          fi

          if [ ! -f "site/sales-calculator.html" ]; then
            echo "::error::销量计算器页面不存在"
            exit 1
          fi

          echo "网页构建检查通过"

      - name: 检查各榜单页面的颜色控制
        shell: bash
        run: |
          echo "检查各榜单页面是否包含颜色控制..."

          found=0

          for file in site/sales.html site/popularity.html site/new.html; do
            if [ ! -f "$file" ]; then
              echo "跳过不存在的页面: $file"
              continue
            fi

            echo "检查 $file"

            for keyword in "剧集显示设置" "白天" "黑夜" "idThreshold"; do
              if ! grep -q "$keyword" "$file"; then
                echo "::error::页面 $file 缺少控件: $keyword"
                exit 1
              fi
            done

            echo "检查通过"
            found=$((found + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何可检查的榜单页面"
            exit 1
          fi

          echo "颜色控制检查完成"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: './site'
          retention-days: 1

  # ============================================================
  # JOB 2：部署网页
  # ============================================================
  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
