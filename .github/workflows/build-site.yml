name: 更新猫耳网页

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'build_site.py'
      - 'requirements.txt'
      - '.github/workflows/build-site.yml'

  workflow_run:
    workflows:
      - 抓取猫耳数据
    types:
      - completed

concurrency:
  group: maoer-site
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # workflow_run 只有在 fetch-data 成功时才构建
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Dashboard
        run: python build_site.py

      
      - name: 检查各榜单页面的颜色控制
        shell: bash
        run: |
          echo "检查各榜单页面是否包含颜色控制..."

          found=0

          for file in site/sales.html site/popularity.html site/new.html; do
            if [ ! -f "$file" ]; then
              echo "跳过不存在的页面: $file"
              continue
            fi

            echo "检查 $file"

            for keyword in "剧集显示设置" "白天" "黑夜" "idThreshold"; do
              if ! grep -q "$keyword" "$file"; then
                echo "::error::页面 $file 缺少控件: $keyword"
                exit 1
              fi
            done

            echo "✅ $file 颜色控制检查通过"
            found=$((found + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何可检查的榜单页面"
            exit 1
          fi

          echo "✅ 颜色控制检查完成"


      

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
