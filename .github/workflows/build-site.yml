name: 更新猫耳网页

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'build_site.py'
      - 'requirements.txt'
      - '.github/workflows/build-site.yml'

  workflow_run:
    workflows:
      - 抓取猫耳数据
    types:
      - completed

concurrency:
  group: maoer-site
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # workflow_run 只有在 fetch-data 成功时才构建
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Dashboard
        run: python build_site.py

      - name: Check generated homepage
        run: |
          echo "检查生成的首页是否包含颜色控制..."
          grep -n "剧集显示设置" site/index.html
          grep -n "白天" site/index.html
          grep -n "黑夜" site/index.html
          grep -n "idThreshold" site/index.html
          echo "颜色控制检查完成"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
